[project]
name = "img23mf"
version = "0.1.0"
description = "Raster images to printable multi-material 3MF plaques"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Kondratev" }]
requires-python = ">=3.11"
dependencies = ["Pillow>=11.2,<13", "typer>=0.16,<1", "shapely>=2.1,<3"]
keywords = ["3mf", "3d-printing", "multicolor", "image", "vectorization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.urls]
Homepage = "https://github.com/fefa4ka/img23mf"
Repository = "https://github.com/fefa4ka/img23mf"
Issues = "https://github.com/fefa4ka/img23mf/issues"

[project.scripts]
img23mf = "img23mf:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["img23mf.py"]

[tool.hatch.build.targets.sdist]
include = ["img23mf.py", "test_img23mf.py", "pyproject.toml", "README.md", "LICENSE"]

[dependency-groups]
dev = ["pytest>=8,<10"]
